<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<style>
  @page {
    size: {{paperWidth}}mm auto;
    margin: 0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cairo', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
    font-size: {{fontSizeMedium}}pt;
    width: 100%;
    max-width: 100%;
    direction: rtl;
    color: #000;
    background: #fff;
    padding: {{marginTop}}mm {{marginRight}}mm {{marginBottom}}mm {{marginLeft}}mm;
    line-height: 1.45;
  }
  @media screen {
    body { border: 1px dashed #ccc; margin: 10px auto; }
  }
  .center { text-align: center; }

  .kitchen-title {
    font-size: {{fontSizeLarge}}pt;
    font-weight: bold;
    text-align: center;
    margin-bottom: 2px;
  }
  .kitchen-title-ar {
    font-size: {{fontSizeMedium}}pt;
    text-align: center;
    margin-bottom: 4px;
  }
  .order-info { font-size: {{fontSizeMedium}}pt; margin: 2px 0; }
  .table-num {
    font-size: 20pt;
    font-weight: bold;
    text-align: center;
    margin: 6px 0;
    border: 2px solid #000;
    padding: 4px;
  }

  .sep { border: none; border-top: 1px dashed #000; margin: 6px 0; }

  .item {
    font-size: {{fontSizeMedium}}pt;
    font-weight: bold;
    margin: 3px 0;
    word-break: break-word;
  }
  .item-notes {
    font-size: {{fontSizeSmall}}pt;
    color: #333;
    padding-right: 12px;
    margin-top: 1px;
    font-style: italic;
  }

  .cashier { font-size: {{fontSizeSmall}}pt; margin-top: 6px; }
</style>
</head>
<body>

<div class="kitchen-title">KITCHEN ORDER</div>
<div class="kitchen-title-ar">أمر المطبخ</div>

<div class="order-info">رقم الطلب: {{InvoiceNumber}}</div>
<div class="order-info">الوقت: {{InvoiceTime}}</div>

{{TableBlock}}

{{OrderTypeRow}}

<hr class="sep">

{{ItemsHtml}}

<hr class="sep">

<div class="cashier">الكاشير: {{CashierName}}</div>

</body>
</html>
